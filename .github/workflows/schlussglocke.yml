name: Donnerstags-Erinnerung (Schlussglocke)

on:
  schedule:
    # Jeden Donnerstag um 09:00 UTC (11:00 Uhr MESZ)
    - cron: '0 9 * * 4'
  workflow_dispatch: # Erlaubt manuelles Testen per Knopfdruck

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Prüfen, ob Termin für morgen aktiv ist
        id: check_status
        run: |
          TOMORROW=$(date -d "+1 day" +%Y-%m-%d)
          echo "Morgiger Freitag: $TOMORROW"

          FIREBASE_URL="https://firestore.googleapis.com/v1/projects/fischbroetchen-65239/databases/(default)/documents/einstellungen/termin"
          RESPONSE=$(curl -s "$FIREBASE_URL")

          SAVED_DATE=$(echo "$RESPONSE" | grep -oP '"datum":\s*\{\s*"stringValue":\s*"\K[^"]+')
          echo "In Firebase gespeicherter Termin: $SAVED_DATE"

          if [ "$SAVED_DATE" = "$TOMORROW" ]; then
            echo "shop_open=true" >> $GITHUB_OUTPUT
            echo "Termin ist aktiv. Benachrichtigungen werden vorbereitet."
          else
            echo "shop_open=false" >> $GITHUB_OUTPUT
            echo "Kein Fisch-Freitag für morgen hinterlegt. Vorgang wird übersprungen."
          fi

      - name: Node.js einrichten
        if: steps.check_status.outputs.shop_open == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Firebase-Admin SDK installieren & Push-Nachrichten senden
        if: steps.check_status.outputs.shop_open == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install firebase-admin
          node send_push.js

      - name: E-Mail Erinnerung an Gerrit senden
        if: steps.check_status.outputs.shop_open == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔔 Letzte Chance: Schlussglocke für Fischbrötchen geläutet!"
          to: gerrit.kreimer@googlemail.com
          from: "Fridays for Fischbrötchen <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Moin Gerrit,

            es ist Donnerstag, 11:00 Uhr!
            Die automatische Push-Schlussglocke wurde soeben an alle Kollegen verschickt, die noch keine Bestellung für morgen abgegeben haben.

            Erinnere ggf. noch kurz die WhatsApp-Gruppe:
            "🔔 Letzter Aufruf: Noch 1 Stunde bis Bestellschluss!"

            App: https://gerritkreimer.github.io/fischbroetchen/
