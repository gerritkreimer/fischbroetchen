name: Donnerstags-Erinnerung (Schlussglocke)

on:
  schedule:
    # Jeden Donnerstag um 09:00 UTC (11:00 Uhr MESZ)
    - cron: '0 9 * * 4'
  workflow_dispatch: # Erlaubt manuelles Testen per Knopfdruck

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Push-Nachrichten prüfen & senden
        id: push_job
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install firebase-admin
          node send_push.js

      - name: E-Mail Erinnerung an Gerrit senden
        if: steps.push_job.outputs.shop_active == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔔 Letzte Chance: Schlussglocke für Fischbrötchen geläutet!"
          to: gerrit.kreimer@googlemail.com
          from: "Fridays for Fischbrötchen <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Moin Gerrit,

            es ist Donnerstag, 11:00 Uhr!
            Die automatische Push-Schlussglocke wurde soeben an alle Kollegen verschickt, die noch keine Bestellung für morgen abgegeben haben.

            Erinnere ggf. noch kurz die WhatsApp-Gruppe:
            "🔔 Letzter Aufruf: Noch 1 Stunde bis Bestellschluss!"

            App: https://gerritkreimer.github.io/fischbroetchen/
