<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fridays for Fischbrötchen</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    // Service Worker nur registrieren, wenn vorhanden
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        fetch('./sw.js', { method: 'HEAD' }).then(res => {
          if (res.ok) navigator.serviceWorker.register('./sw.js').catch(() => {});
        }).catch(() => {});
      });
    }
  </script>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-24 select-none">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white px-4 py-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="handleAdminTrigger()" title="Tippen für Admin-Bereich">
        <span class="text-2xl select-none active:scale-125 transition-transform">🐟</span>
        <div>
          <h1 class="text-lg font-black tracking-tight leading-tight">Fridays for Fischbrötchen</h1>
          <p class="text-xs text-blue-200 flex items-center space-x-1">
            <span id="headerEventDate">Freitag, --.--.</span>
            <span id="adminBadge" class="hidden bg-amber-400 text-slate-900 text-[10px] font-black px-1.5 py-0.2 rounded font-mono">ADMIN</span>
          </p>
        </div>
      </div>
      <div class="flex items-center space-x-1.5">
        <button id="adminHeaderBtn" onclick="openAdminModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-1.5 rounded-full text-xs font-black shadow transition flex items-center space-x-1">
          <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
          <span>Admin</span>
        </button>
        <button onclick="editUserPrompt()" class="bg-blue-800/80 hover:bg-blue-700 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-1 border border-blue-600 transition">
          <i data-lucide="user" class="w-3.5 h-3.5"></i>
          <span id="headerUserName">Anmelden</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Admin Proxy Banner (Aktiv, wenn Admin für einen Kollegen bucht) -->
  <div id="adminProxyBanner" class="hidden bg-amber-400 border-b border-amber-500 text-slate-950 px-4 py-2 text-xs font-black flex items-center justify-between sticky top-[64px] z-20 shadow-md">
    <div class="flex items-center space-x-2">
      <i data-lucide="shield-alert" class="w-4 h-4 text-amber-950"></i>
      <span>ADMIN-BUCHUNG FÜR: <span id="adminProxyNameDisplay" class="underline decoration-2">--</span></span>
    </div>
    <button onclick="exitAdminProxyOrder()" class="bg-slate-900 hover:bg-slate-800 text-white px-2 py-0.5 rounded text-[10px] uppercase font-bold transition active:scale-95">
      Beenden ✕
    </button>
  </div>

  <!-- Main Container -->
  <main class="max-w-md mx-auto w-full px-3 pt-3 flex-1">

    <!-- Status Banner: Dynamische Ampel (Grün pulsierend / Rot dauerhaft) -->
    <div id="shopStatusBanner" class="mb-3 rounded-xl p-3 flex items-center space-x-3 text-xs shadow-sm transition-colors duration-300">
      <div id="statusDot" class="w-2.5 h-2.5 rounded-full flex-shrink-0"></div>
      <div id="statusBannerText" class="flex-1 font-medium">
        <!-- Dynamisch per JS -->
      </div>
    </div>

    <!-- Meine aktuelle Bestellung Card (Erscheint nur wenn Bestellung in Firebase vorliegt) -->
    <div id="userOrderCard" class="hidden mb-3 bg-white border-2 border-blue-600 rounded-2xl p-4 shadow-sm">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div class="flex items-center space-x-1.5 text-blue-900">
          <i data-lucide="package-check" class="w-4 h-4 text-emerald-600"></i>
          <span class="text-xs font-black uppercase tracking-wider">Deine aktuelle Bestellung</span>
        </div>
        <span id="userOrderStatusBadge" class="text-[10px] font-black bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Gebucht</span>
      </div>

      <div id="userOrderItemsList" class="py-2.5 space-y-1.5 text-xs">
        <!-- Dynamisch befüllt -->
      </div>

      <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
        <div>
          <span class="text-[11px] text-slate-400 font-semibold">Gesamtsumme</span>
          <p id="userOrderTotal" class="text-base font-black text-blue-950">0,00 €</p>
        </div>
        <button id="btnCancelOrEditOrder" onclick="cancelAndEditOrder()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center space-x-1 transition active:scale-95">
          <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
          <span>Bestellung bearbeiten</span>
        </button>
      </div>
      <p id="orderLockNotice" class="hidden text-[10px] text-amber-700 font-medium mt-1 text-right">Bestellfenster geschlossen (Keine Änderung mehr möglich)</p>
    </div>

    <!-- Kategorien Tabs -->
    <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-2 pt-1" id="categoryBar">
      <!-- Dynamisch per JS -->
    </div>

    <!-- Speisen Liste -->
    <div class="space-y-2.5 mt-2" id="dishesList">
      <!-- Dynamisch per JS -->
    </div>

  </main>

  <!-- Floating Warenkorb Footer Bar -->
  <div class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-xl px-4 py-3 pb-safe">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <button onclick="toggleCartModal(true)" class="flex items-center space-x-3 focus:outline-none">
        <div class="relative bg-blue-900 text-white p-2.5 rounded-2xl shadow-sm">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i>
          <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow">0</span>
        </div>
        <div class="text-left">
          <p class="text-xs text-slate-500 font-medium">Dein Warenkorb</p>
          <p id="cartTotalSum" class="text-base font-black text-slate-900">0,00 €</p>
        </div>
      </button>

      <button onclick="toggleCartModal(true)" id="btnOpenCart" class="bg-blue-700 hover:bg-blue-800 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center space-x-1.5">
        <span>Ansehen & Bestellen</span>
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- MODAL: Admin erfasst Kollegen für Sonderbuchung -->
  <div id="adminProxyModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-left">
      <div class="flex items-center space-x-3 mb-4">
        <div class="w-10 h-10 bg-amber-100 text-amber-900 rounded-2xl flex items-center justify-center font-bold">
          <i data-lucide="user-plus" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-base font-black text-slate-9
